<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="Animated ASCII pet blinking and hopping" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="2" y="2" width="516" height="226" rx="18" fill="#fff5f8" stroke="#ffb3c9" stroke-width="3" stroke-dasharray="8 6"/>

  <g font-family="'Courier New', Courier, monospace" xml:space="preserve">
    <text x="24" y="34" font-size="13" fill="#f4a3bd">~ seville's home :: pet.exe ~</text>
    <text x="392" y="34" font-size="13" fill="#f4a3bd">lv.10  xp 100%</text>

    <!-- IDLE -->
    <g fill="#e0578a" font-size="20" opacity="1">
      <animate attributeName="opacity" values="1;1;1;0;1;0;0;1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" calcMode="discrete" dur="3.2s" repeatCount="indefinite"/>
      <ellipse cx="260" cy="150" rx="42" ry="6" fill="#f7c6d6"/>
      <text x="206" y="88">  /\_/\</text>
      <text x="206" y="112"> ( o.o )</text>
      <text x="206" y="136">  &gt; ^ &lt;</text>
    </g>

    <!-- BLINK -->
    <g fill="#e0578a" font-size="20" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" calcMode="discrete" dur="3.2s" repeatCount="indefinite"/>
      <ellipse cx="260" cy="150" rx="42" ry="6" fill="#f7c6d6"/>
      <text x="206" y="88">  /\_/\</text>
      <text x="206" y="112"> ( -.- )</text>
      <text x="206" y="136">  &gt; ^ &lt;</text>
    </g>

    <!-- HOP -->
    <g fill="#e0578a" font-size="20" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" calcMode="discrete" dur="3.2s" repeatCount="indefinite"/>
      <ellipse cx="260" cy="150" rx="28" ry="4" fill="#f7c6d6"/>
      <text x="206" y="68">  /\_/\</text>
      <text x="206" y="92"> ( ^.^ )</text>
      <text x="206" y="116">  &gt; ^ &lt;</text>
      <text x="156" y="72" fill="#ffb347">*</text>
      <text x="340" y="96" fill="#ffb347">+</text>
      <text x="170" y="112" fill="#ffb347">.</text>
      <text x="326" y="64" fill="#ffb347">*</text>
      <text x="350" y="78" font-size="16" fill="#b46bd6">+90%!</text>
    </g>

    <!-- GROUND -->
    <text x="112" y="196" font-size="16" fill="#f4a3bd">. ' * . ' . * ' . ' * . ' . * ' . ' * .</text>
    <text x="140" y="218" font-size="13" fill="#f4a3bd">complete tasks &gt; earn points &gt; level up</text>
  </g>
</svg>
